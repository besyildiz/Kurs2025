<html><head>
    <meta charset="utf-8" />
    <title>TOSYA-IOT Panel</title>
</head><body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>

<div style="font-family: Arial; padding: 20px; background: #f4f4f4; border-radius: 8px; width: 300px;">
    <h2>TOSYA-IOT Canlı Veri</h2>
    <hr />
    <p style="font-size: 20px;"><strong>Sıcaklık:</strong> <span id="web_sicaklik">Yükleniyor...</span> °C</p>
    <p style="font-size: 20px;"><strong>Nem:</strong> %<span id="web_nem">Yükleniyor...</span></p>
    <small style="color: green;" id="baglanti_durumu">Sunucuya bağlanılıyor...</small>
</div>

<script>
    // Tarayıcılar için WebSocket SSL portu (8884) kullanılır
    const broker = 'wss://broker.hivemq.com:8884/mqtt'; 
    const client = mqtt.connect(broker);

    client.on('connect', function () {
        document.getElementById('baglanti_durumu').innerText = 'Canlı Veri Bağlantısı Aktif';
        document.getElementById('baglanti_durumu').style.color = 'green';
        
        // ESP8266'nın yayın yaptığı konulara abone oluyoruz
        client.subscribe('burak37/sicaklik');
        client.subscribe('burak37/nem');
    });

    client.on('message', function (topic, message) {
        // Gelen veriyi string formatına çeviriyoruz
        const veri = message.toString();

        if (topic === 'burak37/sicaklik') {
            document.getElementById('web_sicaklik').innerText = parseFloat(veri).toFixed(1);
        } else if (topic === 'burak37/nem') {
            document.getElementById('web_nem').innerText = parseInt(veri);
        }
    });

    client.on('error', function (err) {
        document.getElementById('baglanti_durumu').innerText = 'Bağlantı Hatası!';
        document.getElementById('baglanti_durumu').style.color = 'red';
        console.log(err);
    });
</script> </body> </html>
